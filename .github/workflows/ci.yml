name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SDK_PIN: 812c46f

jobs:
  openmuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: openmuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          node --check src/index.js
          node --check src/node.js
          npm test

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CJSON_SOURCE_DIR: ${{ github.workspace }}/cjson
    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell entry points
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error apply.sh openmuse/run.sh

      - name: Clone the pristine Muse SDK at the pinned revision
        run: |
          git clone https://github.com/facebookincubator/muse-gadget-sdk.git sdk
          git -C sdk checkout ${{ env.SDK_PIN }}

      - name: Apply the brain patch (also validates it against the pinned upstream)
        run: |
          printf 'sk-ci-dummy\n\n\nn\ny\n' | ./apply.sh "$PWD/sdk" --preset quicksilver

      - name: Fetch cJSON for the host harnesses
        run: |
          curl -fsSL https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.18.tar.gz | tar xz
          mv cJSON-1.7.18 cjson
          # SDK harnesses resolve cJSON from managed_components; a few read CJSON_SOURCE_DIR.
          mkdir -p sdk/esp32/managed_components/espressif__cjson/cJSON
          cp -R cjson/. sdk/esp32/managed_components/espressif__cjson/cJSON/

      - name: Run the host test suite
        working-directory: sdk/esp32
        run: python3 -m unittest discover -s tests -p 'test_*.py'
